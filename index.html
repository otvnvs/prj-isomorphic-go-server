<!DOCTYPE html>
<html lang="en">
<head>
    <title>WASM  — Loading</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
body {
  background: #171826;
  /* Centers the content */
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

p {
  color: #FFFFFF;
  font-family: sans-serif;
  font-size: 1.5rem;
  /* Applies the animation */
  animation: pulse 1.5s infinite ease-in-out;
}

/* Pulse effect: scales size and adjusts opacity */
@keyframes pulse {
  0% {
    transform: scale(0.95);
    opacity: 0.7;
  }
  50% {
    transform: scale(1.05);
    opacity: 1;
  }
  100% {
    transform: scale(0.95);
    opacity: 0.7;
  }
}

</style>
</head>
<body>
    <p>Loading...</p>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').then(() => {
                // Reload once the SW is controlling the page so requests are intercepted.
                if (!navigator.serviceWorker.controller) {
                    navigator.serviceWorker.addEventListener('controllerchange', () => {
                        //window.location.reload();
                    });
                }
                        window.location.reload();
            });
        } else {
            document.body.innerHTML = '<p>Service Workers are not supported in this browser.</p>';
        }
    </script>
</body>
</html>
