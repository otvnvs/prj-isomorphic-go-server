<!DOCTYPE html>
<html lang="en">
<head>
    <title>WASM Auth</title>
    <meta charset="UTF-8">
    <!-- Updated viewport to prevent horizontal scrolling and handle safe areas -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- Toast notifications show at the top for better thumb-reach visibility -->
    <div id="toast" role="alert" aria-live="assertive"></div>

    <main class="card">
        <!-- Status bar acts as a header -->
        <div id="status">Syncing...</div>

        <div id="auth-fields">
            <!-- autocapitalize="none" prevents mobile keyboards from capitalizing the first letter -->
            <input id="u" 
                   type="text" 
                   placeholder="Username" 
                   autocapitalize="none" 
                   spellcheck="false" 
                   autocomplete="username">
            
            <input id="p" 
                   type="password" 
                   placeholder="Password" 
                   autocomplete="current-password">

            <button onclick="doAuth('./api/login')" id="login-btn">
                <span class="btn-text">Sign In</span>
                <div class="spinner"></div>
            </button>
            
            <button onclick="doAuth('./api/signup')" class="secondary-btn">Create Account</button>
        </div>

        <div id="user-fields" class="hidden">
            <button class="danger" onclick="doLogout()">Log Out</button>
        </div>

        <footer id="version-info">
            Version: <span id="v-num">...</span><br>
            Built: <span id="v-time"></span>
        </footer>
    </main>

    <script src="./main.js"></script>
</body>
</html>
